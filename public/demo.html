<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI assistant demo by RHKLytics</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root { --brand: #0F7C78; --ink: #1d2430; --muted: #5d6673; --line: #e4e7ea; --bg: #fafaf9; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1.02rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { width: min(1000px, 100% - 32px); margin-inline: auto; }
  h1, h2 { line-height: 1.15; margin: 0; }
  .bar { background: #1d2430; color: #fff; font-size: .93rem; }
  .bar .wrap { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: space-between; align-items: center; padding: 10px 0; }
  .bar a { color: #9fe3dc; font-weight: 700; }
  .barlinks { display: flex; align-items: center; gap: 14px; }
  .langbtn { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.6); border-radius: 999px; padding: 3px 12px; font: inherit; font-size: .9rem; cursor: pointer; }
  .langbtn:focus-visible { outline: 3px solid #F4B33E; outline-offset: 2px; }
  html[dir=rtl] body { font-family: system-ui, -apple-system, "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif; }
  .hero { background: var(--brand); color: #fff; padding: 56px 0; }
  .hero .kicker { text-transform: uppercase; letter-spacing: .08em; font-size: .82rem; font-weight: 700; opacity: .85; margin: 0 0 10px; }
  .hero h1 { font-size: clamp(2.1rem, 5vw, 3.3rem); }
  .hero p { font-size: 1.12rem; max-width: 46ch; margin: 16px 0 26px; opacity: .95; }
  .btn { display: inline-block; background: #fff; color: var(--brand); border: 0; border-radius: 999px; padding: 12px 24px; font: inherit; font-weight: 700; cursor: pointer; }
  section { padding: 52px 0; }
  section h2 { font-size: 1.7rem; margin-bottom: 22px; }
  .list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 0 44px; }
  .list li { display: flex; justify-content: space-between; gap: 16px; padding: 13px 0; border-bottom: 1px dashed var(--line); }
  .list span { display: block; color: var(--muted); font-size: .9rem; }
  .list b { white-space: nowrap; color: var(--brand); }
  .info { background: #fff; border-top: 1px solid var(--line); }
  .info p { margin: 0 0 6px; color: var(--muted); }
  footer { padding: 26px 0; color: var(--muted); font-size: .9rem; border-top: 1px solid var(--line); }
  .missing { padding: 90px 0; text-align: center; }
  @media (max-width: 720px) { .list { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="bar"><div class="wrap">
  <span id="barText">AI assistant demo by RHKLytics.</span>
  <span class="barlinks">
    <button type="button" class="langbtn" id="langBtn">عربي</button>
    <a id="getOne" href="https://rhklytics.netlify.app/" target="_blank" rel="noopener">Get one for your business</a>
  </span>
</div></div>

<main id="page" hidden>
  <div class="hero"><div class="wrap">
    <p class="kicker" id="type"></p>
    <h1 id="name"></h1>
    <p id="tagline"></p>
    <button class="btn" id="openChat" type="button">Ask our assistant</button>
  </div></div>

  <section><div class="wrap">
    <h2 id="hServices">Services and prices</h2>
    <ul class="list" id="services"></ul>
  </div></section>

  <section class="info"><div class="wrap">
    <h2 id="hHours">Opening hours</h2>
    <div id="hours"></div>
    <p id="location"></p>
  </div></section>
</main>

<div class="missing wrap" id="missing" hidden>
  <h1>Demo not found</h1>
  <p>Check the link, or <a href="/">see the Glow Studio demo</a>.</p>
</div>

<footer><div class="wrap" id="foot">Demo built by RHKLytics.</div></footer>

<script>
(async function () {
  const key = location.pathname.replace(/^\/demo\/?/, "").replace(/\/$/, "")
           || new URLSearchParams(location.search).get("b") || "";
  const $ = id => document.getElementById(id);
  let b = null;
  try {
    const res = await fetch("/api/profile?b=" + encodeURIComponent(key));
    if (res.ok) b = await res.json();
  } catch {}
  if (!b) { $("missing").hidden = false; return; }
  const ar = b.ar || {};

  const T = {
    en: { ask: "Ask our assistant", services: "Services and prices", hours: "Opening hours", getOne: "Get one for your business", toggle: "عربي",
          title: b.name + " | AI assistant demo by RHKLytics",
          barProspect: "Demo made by RHKLytics to show " + b.name + " an AI assistant. This is not their official website, and bookings made here are not sent to them.",
          footProspect: "Prepared by RHKLytics as a demo for " + b.name + ". Details are taken from public information and may be out of date.",
          barSample: b.name + " is a sample business created to demonstrate an AI booking assistant.",
          footSample: b.name + " is fictional. Demo built by RHKLytics." },
    ar: { ask: "اسأل مساعدنا", services: "الخدمات والأسعار", hours: "مواعيد العمل", getOne: "احصل على مساعد لنشاطك", toggle: "English",
          title: b.name + " | مساعد ذكي تجريبي من RHKLytics",
          barProspect: "نسخة تجريبية من RHKLytics لعرض مساعد ذكي على " + b.name + ". هذا ليس الموقع الرسمي، والحجوزات هنا لا تُرسل إليهم.",
          footProspect: "أعدّتها RHKLytics كنسخة تجريبية لـ " + b.name + ". المعلومات مأخوذة من مصادر عامة وقد لا تكون محدّثة.",
          barSample: b.name + " نشاط تجريبي للتعريف بمساعد الحجز الذكي.",
          footSample: b.name + " نشاط افتراضي. تطوير RHKLytics." },
  };
  const arPrice = (p) => String(p || "").replace(/^from AED\s*([\d,]+)/i, "ابتداءً من $1 درهم").replace(/^AED\s*([\d,]+)/i, "$1 درهم");
  const arDur = (d) => String(d || "").replace(/(\d+)\s*min each/i, "$1 دقيقة لكل حصة").replace(/(\d+)\s*min/i, "$1 دقيقة");
  let lang = (new URLSearchParams(location.search).get("lang") === "ar") ? "ar" : "en";

  function render() {
    const t = T[lang], A = lang === "ar";
    document.documentElement.lang = lang;
    document.documentElement.dir = A ? "rtl" : "ltr";
    document.title = t.title;
    $("type").textContent = (A && ar.type || b.type) + " · " + (A && ar.location || b.location);
    $("name").textContent = b.name;
    $("tagline").textContent = A && ar.tagline || b.tagline || "";
    $("location").textContent = A && ar.location || b.location;
    $("openChat").textContent = t.ask;
    $("hServices").textContent = t.services;
    $("hHours").textContent = t.hours;
    $("getOne").textContent = t.getOne;
    $("langBtn").textContent = t.toggle;
    $("langBtn").setAttribute("lang", A ? "en" : "ar");
    $("barText").textContent = b.prospect ? t.barProspect : t.barSample;
    $("foot").textContent = b.prospect ? t.footProspect : t.footSample;
    $("services").innerHTML = "";
    for (const s of b.services || []) {
      const li = document.createElement("li");
      const left = document.createElement("div");
      left.textContent = A && s.name_ar || s.name;
      const sub = document.createElement("span"); sub.textContent = A ? arDur(s.duration) : (s.duration || "");
      left.appendChild(sub);
      const price = document.createElement("b"); price.textContent = A ? arPrice(s.price) : (s.price || "");
      li.append(left, price);
      $("services").appendChild(li);
    }
    $("hours").innerHTML = "";
    for (const h of (A && ar.hours) || b.hours || []) {
      const p = document.createElement("p"); p.textContent = h; $("hours").appendChild(p);
    }
  }
  function setLang(l) { if (l === lang) return; lang = l; render(); if (window.RKChat) window.RKChat.setLang(l); }
  render();
  $("page").hidden = false;
  $("langBtn").addEventListener("click", () => setLang(lang === "ar" ? "en" : "ar"));
  window.addEventListener("rk-lang", (e) => { if (e.detail !== lang) { lang = e.detail; render(); } });

  const w = document.createElement("script");
  w.src = "/widget.js";
  w.dataset.business = key.toLowerCase();
  w.dataset.name = b.name;
  w.dataset.color = b.color || "#0F7C78";
  w.dataset.greeting = b.greeting || "Hi! How can I help you today?";
  if (ar.greeting) w.dataset.greetingAr = ar.greeting;
  if (b.chips && b.chips.length) w.dataset.chips = b.chips.join("|");
  if (ar.chips && ar.chips.length) w.dataset.chipsAr = ar.chips.join("|");
  if (b.whatsapp) w.dataset.whatsapp = b.whatsapp;
  w.dataset.lang = lang;
  document.body.appendChild(w);

  $("openChat").addEventListener("click", () => {
    const panel = document.querySelector(".rk-panel");
    if (panel && !panel.classList.contains("rk-open")) document.querySelector(".rk-launch").click();
  });
})();
</script>
</body>
</html>
